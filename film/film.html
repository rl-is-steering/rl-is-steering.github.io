<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet">
<title>Overview film</title>

<style>
:root { --ink: #1b1b1b; --muted: #5f5f5f; --base: #8a8a8a; --s: #861F41; --rl: #1b1b1b; --bad: #d55e00; --ok: #009e73; --track: #eef3f8; --soft: #f3f3f3 }
* { box-sizing: border-box; margin: 0 }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; color: var(--ink); font-family: Optima, Candara, Inter, "Helvetica Neue", Arial, sans-serif }
#world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0 }
#top, #hud { position: absolute; inset: 0; pointer-events: none }
#top { z-index: 5 } #hud { z-index: 10 }
.abs { position: absolute }
.lab { font-size: 40px; font-weight: 700; text-align: center; white-space: nowrap }
.c-base { color: var(--base) } .c-s { color: var(--s) } .c-rl { color: var(--rl) }
.frame { position: absolute; overflow: hidden; border: 2px solid #000; background: #f2f2f2 }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block }
.score { font-size: 36px; font-variant-numeric: tabular-nums; white-space: nowrap }
.prompt { font-family: Gabriola, Georgia, serif; font-size: 38px; line-height: 1.05; text-align: center; color: var(--ink); white-space: nowrap }
.ctx { font-size: 36px; color: var(--ink); white-space: nowrap }
.m { font-family: "Times New Roman", "STIX Two Text", serif; font-style: italic; white-space: nowrap }
.mb { font-family: "Times New Roman", "STIX Two Text", serif; font-weight: 700; font-style: normal }
.op { position: absolute; font-size: 60px; font-weight: 400; text-align: center; font-family: "Times New Roman", serif }
#cap { position: absolute; left: 160px; right: 160px; top: 940px; height: 136px; display: flex; align-items: center; justify-content: center }
#cap span { font-size: 36px; line-height: 1.3; text-align: center; text-wrap: balance; color: var(--ink) }
.stripe { position: absolute; outline: 2px solid #000 }
.stripe > div { position: absolute; left: 0; width: 100% }
.stripe.sv { outline: 3px solid var(--s) }
#world sub, #hudw sub { font-size: max(0.83em, 32px) }   /* subscripts keep the 32 px floor too */   /* s: the paper's grey and black cells, with a blue outline */
.blk { position: absolute; border: 2px solid #000; background: var(--soft); border-radius: 10px }
.rowlab { position: absolute; font-size: 36px; white-space: nowrap }
.frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block }
.grp { position: absolute; font-size: 38px; font-weight: 700; white-space: nowrap }
.val { position: absolute; font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap }
.mark { font-size: 64px; font-weight: 700; text-align: center }
.dot { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--s); margin: -15px 0 0 -15px }
.dia { position: absolute; width: 26px; height: 26px; background: var(--rl); margin: -13px 0 0 -13px; transform: rotate(45deg) }
.head { font-size: 48px; font-weight: 700; white-space: nowrap }
.tok { position: absolute; width: 16px; height: 32px; border: 2px solid #000; background: linear-gradient(#d9d9d9 0 33%, #9a9a9a 33% 66%, #c4c4c4 66%) }
:root { --base: #75787B; --rl: #E5751F; --rl-ink: #CA4F00; --track: #EBD3DB; --bad: #4a4a50 }
.c-rl { color: #CA4F00 }
#cap { display: none }
</style>
</head>
<body>
<div id="world"></div>
<div id="top"></div>
<div id="hud"><div id="hudw"></div><div id="cap"><span></span></div></div>

<script>
const $ = id => document.getElementById(id);
const WEB = true;
if (WEB) document.title = 'Film v4';
const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x;
const ease = p => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };   // cubic in-out, no overshoot
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const css = (el, o) => Object.assign(el.style, o);
const px = v => v.toFixed(1) + 'px';
function mk(parent, tag, cls, html, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) css(e, style); parent.appendChild(e); return e; }
function div(parent, cls, html, x, y, style) { return mk(parent, 'div', cls, html, { left: px(x), top: px(y), ...style }); }
function frame(parent, src, video) {
  const f = mk(parent, 'div', 'frame');
  const m = mk(f, video ? 'video' : 'img'); m.src = src; if (video) { m.muted = true; m.preload = 'auto'; }
  return [f, m];
}
const seeks = [];
function seek(v, time) {  // frame-accurate clip time; render() waits for every pending seek
  const tt = Math.min(Math.max(0, time), v.duration - 0.001);
  if (Math.abs(v.currentTime - tt) < 1e-4) return;
  seeks.push(new Promise(r => v.addEventListener('seeked', () => { v.requestVideoFrameCallback(() => r()); setTimeout(r, 300); }, { once: true })));
  v.currentTime = tt;
}
const fmt = (v, d) => v.toFixed(d);
const cap = (S, k) => S.caps[k][0];   // start of narration sentence k within the scene
function place(el, x, y, w, h) { css(el, { left: px(x), top: px(y), width: px(w), height: h == null ? '' : px(h) }); }
const op = (els, o) => (Array.isArray(els) ? els : [els]).forEach(e => css(e, { opacity: o }));
function rnd(seed) { let s = seed % 2147483647 || 1; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
const vals = (seed, n) => { const r = rnd(seed); return Array.from({ length: n }, r); };
const SHADE = { z: v => 62 + 34 * v, h: v => 45 + 45 * v, s: v => 6 + 58 * v, d: v => 30 + 52 * v };
function stripe(parent, values, kind, w, ch) {
  const g = mk(parent, 'div', 'stripe', null, { width: px(w), height: px(ch * values.length) });
  g.cells = values.map((v, i) => mk(g, 'div', null, null, { top: px(i * ch), height: px(ch - 2), background: `hsl(0,0%,${SHADE[kind](v)}%)` }));
  g.set = (vs, k2) => vs.forEach((v, i) => { g.cells[i].style.background = `hsl(0,0%,${SHADE[k2 || kind](clamp(v))}%)`; });
  return g;
}
const lock = q => `<svg width="30" height="40" viewBox="0 -6 30 40" style="vertical-align:-6px"><path d="M8 15V10a7 7 0 0 1 14 0v5" transform="translate(0 ${(-7 * (1 - q)).toFixed(2)})" fill="none" stroke="#1b1b1b" stroke-width="3"/><rect x="3" y="15" width="24" height="17" rx="3" fill="#1b1b1b"/></svg>`;
const LOCK = '<svg width="30" height="34" viewBox="0 0 30 34" style="vertical-align:-4px"><path d="M8 15V10a7 7 0 0 1 14 0v5" fill="none" stroke="#1b1b1b" stroke-width="3"/><rect x="3" y="15" width="24" height="17" rx="3" fill="#1b1b1b"/></svg>';
const S_ = '<span class="mb">s</span>';
const SV = vals(7, 5);                 // the values of s: the hero and every copy share them
const AX = 960, AY = 470;              // screen point the camera centres on (above the caption band)
const DX = 2400;                       // scene 2 sits to the right of scene 1 on the world canvas
const SC1 = { G2: 12.68 };             // set from PLAN in ready()
const G = {};                          // film time at which scene n starts, from PLAN
let SHOTS = [];                        // camera moves after scene 2: [start, end, target], set in ready()

// ---------- camera: centre (x, y) in world coordinates and zoom k, kept within 0.85-1.25 ----------
function cam(T) {
  const u = T - SC1.G2;
  let k = lerp(1.1, 1.0, seg(T, 3.9, 5.0));                  // pull back as RL-tuned joins
  k = lerp(k, 1.04, seg(T, 7.0, 9.3));                        // slow push, still from 9.3 before "spells both"
  const pp = seg(T, 11.55, 13.15);                            // pan to scene 2 behind the flying s
  k = lerp(k, 1.06, pp) - 0.08 * Math.sin(Math.PI * pp);   // scene 2: the diagram (world y 106-800) centred in the frame above the captions
  const pb = seg(u, 18.19, 18.97);                            // on "In all": make room for the bars; still from 18.97, before "SD3.5" and "188"
  let c = { x: lerp(960, DX + 960, pp), y: lerp(lerp(470, 453, pp), 546, pb), k: lerp(k, 1.0, pb) };
  for (const [a, b, to] of SHOTS) {                          // later moves: cubic, with a slight zoom dip on long pans
    if (T <= a) break;
    const p = seg(T, a, b), d = Math.hypot(to.x - c.x, to.y - c.y);
    c = { x: lerp(c.x, to.x, p), y: lerp(c.y, to.y, p), k: lerp(c.k, to.k, p) - (d > 1200 ? 0.06 * Math.sin(Math.PI * p) : 0) };
  }
  return c;
}
const w2s = (C, x, y) => [(x - C.x) * C.k + AX, (y - C.y) * C.k + AY];
const s2w = (C, x, y) => [(x - AX) / C.k + C.x, (y - AY) / C.k + C.y];

// ---------- scene 1: Base and RL-tuned; one s drops into both rows and the Base signs spell right ----------
const S1 = { Y: [140, 510], W: 290, XB: 550, XR: 1080, SLOT: 380 };   // SLOT: left of Base, clear of both prompts (they start at x 450)
(function build1() {
  const host = $('world'), W = S1.W;
  S1.lb = div(host, 'abs lab c-base', 'Base', S1.XB, 66, { width: px(W) });
  S1.ls = div(host, 'abs lab c-s', 'Base + ' + S_, S1.XB - 40, 66, { width: px(W + 80) });
  S1.lr = div(host, 'abs lab c-rl', 'RL-tuned', S1.XR, 66, { width: px(W) });
  const prompts = ['“An astronaut … holding up a white sign that reads ‘All That RL for a Constant Shift?’ …”',
                   '“A city street with a neon sign that says ‘Deep Learning’”'];
  S1.rows = S1.Y.map((y, r) => {
    const o = { y };
    [o.fb] = frame(host, `../media/img/sd35_ocr_teaser${r}_base.jpg`); place(o.fb, S1.XB, y, W, W);
    [o.fs] = frame(host, `../media/img/sd35_ocr_teaser${r}_shift.jpg`); place(o.fs, S1.XB, y, W, W);
    [o.fr] = frame(host, `../media/img/sd35_ocr_teaser${r}_rl.jpg`); place(o.fr, S1.XR, y, W, W);
    o.plus = div(host, 'op', '+', 465, y + 105, { width: '40px' });
    o.ap = div(host, 'op', '≈', 930, y + 105, { width: '60px' });
    o.pr = div(host, 'abs prompt', prompts[r], 0, y + W + 8, { width: '1920px' });
    o.cp = stripe(host, SV, 's', 40, 48); o.cp.classList.add('sv');
    o.edge = div(host, 'abs', null, 0, y, { width: '4px', height: px(W), background: 'var(--s)' });   // front of the Base + s wipe
    return o;
  });
})();
function s1(T) {
  const pB = seg(T, 1.0, 1.4), pR = seg(T, 4.25, 4.85), pL = seg(T, 10.35, 10.65);
  op(S1.lb, pB * (1 - pL)); op(S1.ls, pL); op(S1.lr, pR);
  S1.rows.forEach((o, r) => {
    const pI = seg(T, 1.15 + 0.08 * r, 1.75 + 0.08 * r), pRr = seg(T, 4.25 + 0.08 * r, 4.85 + 0.08 * r);
    op([o.fb, o.fs, o.pr], pI); css(o.fb, { transform: `translateY(${px(24 * (1 - pI))})` }); css(o.fs, { transform: o.fb.style.transform });
    css(o.pr, { transform: o.fb.style.transform });
    op(o.fr, pRr); css(o.fr, { transform: `translateY(${px(24 * (1 - pRr))})` });
    // the copy: splits from the dropped s and sits left of Base; on "spells" Base + s wipes in from its side; then both copies merge in row 1
    const ty = o.y + 25, sp = seg(T, 6.3 + 0.06 * r, 6.9 + 0.06 * r), sw = seg(T, 9.85 + 0.08 * r, 10.5 + 0.08 * r), cv = seg(T, 11.05, 11.4);
    place(o.cp, S1.SLOT, lerp(lerp(350, ty, sp), S1.Y[1] + 25, cv), 40, 240); op(o.cp, T >= 6.3 && T < 11.4 ? 1 : 0);
    css(o.fs, { clipPath: `inset(0 ${px(S1.W * (1 - sw))} 0 0)` });
    css(o.edge, { left: px(S1.XB + S1.W * sw - 2), transform: o.fb.style.transform }); op(o.edge, Math.sin(Math.PI * sw));
    op(o.plus, seg(T, 6.5, 6.9) * (1 - seg(T, 11.0, 11.3)));
    const pA = seg(T, 10.3, 10.7), g = Math.round(lerp(205, 27, pA));
    op(o.ap, seg(T, 9.9, 10.2)); css(o.ap, { color: `rgb(${g},${g},${g})` });   // ≈ lights up on "both"
  });
}

// ---------- scene 2: RL shifts each token its own way; s is one stripe copied onto every token ----------
const S2 = { NC: 6 };
(function build2() {
  const host = $('world'), NC = S2.NC;
  S2.halves = [0, 1].map(k => {
    const o = { k }, c0 = DX + (k ? 1094 : 476), ix = DX + (k ? 1484 : 96);
    o.cols = Array.from({ length: NC }, (_, c) => c0 + 64 * c);
    o.order = o.cols.map((_, c) => k ? c : NC - 1 - c);   // distance from the centre, for the wave
    o.tl = div(host, 'abs ctx', `tokens of prompt <span class="m">${k ? 'j' : 'i'}</span>`, c0 - 10, 106, { width: '350px', textAlign: 'center' });
    o.z = o.cols.map((x, c) => { const s = stripe(host, vals(100 + 10 * k + c, 5), 'z', 30, 20); css(s, { left: px(x), top: '170px' }); return s; });
    div(host, 'blk', null, c0 - 10, 300, { width: '370px', height: '84px' });
    div(host, 'abs', 'block <span class="m">ℓ</span>', c0 + 8, 318, { fontSize: '36px', whiteSpace: 'nowrap' });
    o.w = div(host, 'abs', '', c0 + 160, 316, { fontSize: '36px', whiteSpace: 'nowrap' });
    o.h = o.cols.map((x, c) => { const s = stripe(host, vals(200 + 10 * k + c, 5), 'h', 30, 20); css(s, { left: px(x), top: '420px' }); return s; });
    o.plus = o.cols.map(x => div(host, 'abs', '+', x - 5, 522, { fontSize: '40px', fontWeight: 700, width: '40px', textAlign: 'center' }));
    o.dv = o.cols.map((_, c) => vals(300 + 17 * k + 7 * c, 5));
    o.d = o.cols.map((x, c) => stripe(host, o.dv[c], 'd', 30, 20));
    o.s = o.cols.map(() => { const s = stripe(host, SV, 's', 30, 20); s.classList.add('sv'); css(s, { transformOrigin: '0 0' }); return s; });
    o.dl = div(host, 'abs m', '', c0 - 10, 694, { fontSize: '40px', width: '350px', textAlign: 'center' });
    o.img = ['base', 'rl', 'shift'].map(a => { const [f] = frame(host, `assets3/${k ? 'spin' : 'fall'}_${a}.png`); place(f, ix, 200, 340, 340); return f; });
    o.il = div(host, 'abs lab', '', ix, 556, { width: '340px' });
    return o;
  });
  div(host, 'abs m', '<span class="mb">z</span>', DX + 930, 196, { fontSize: '44px', width: '60px', textAlign: 'center' });
  div(host, 'abs m', '<span class="mb">h</span>', DX + 930, 446, { fontSize: '44px', width: '60px', textAlign: 'center' });
  S2.seed = div(host, 'abs ctx', '', DX + 860, 106, { width: '200px', textAlign: 'center' });
  S2.rel = div(host, 'abs m', '', DX, 760, { width: '1920px', textAlign: 'center', fontSize: '46px' });
  // hud: parameter bars, in screen coordinates
  const hud = S2.bars = mk($('hudw'), 'div', null, null, { position: 'absolute', inset: '0' }); S2.BX = 640; S2.BW = 900;
  S2.b1l = div(hud, 'rowlab', 'rank-32 LoRA', 220, 742); S2.b1 = div(hud, 'abs', null, S2.BX, 740, { height: '48px', background: 'var(--rl)' });
  S2.b1v = div(hud, 'abs score', '18.8M parameters', 0, 743);
  S2.b2l = div(hud, 'rowlab', '188 vectors ' + S_, 220, 824, { color: 'var(--s)' }); S2.b2 = div(hud, 'abs', null, S2.BX, 822, { height: '48px', background: 'var(--s)' });
  S2.b2v = div(hud, 'abs score', '', S2.BX + S2.BW * 0.29 / 18.8 + 24, 825);
  S2.title = div($('hudw'), 'abs', 'RL Post-Training in Diffusion Transformers Is Activation Steering', 0, 420, { width: '1920px', textAlign: 'center', fontSize: '56px', fontWeight: 700, whiteSpace: 'nowrap' });
})();
function s2(u, T) {
  const pRL = seg(u, 1.24, 1.71), pBack = seg(u, 9.4, 9.76), pS = seg(u, 14.29, 14.93);
  const seedK = u < 16.86 ? 0 : u < 17.34 ? 1 : u < 17.79 ? 2 : 0;          // "... and every seed": new inputs, the same s
  const seedOn = seg(u, 16.37, 16.64) * (1 - seg(u, 17.79, 18.08));
  S2.seed.textContent = `seed ${seedK + 1}`; op(S2.seed, seedOn);
  const Cf = cam(SC1.G2 + 19.76), bw = S2.BW * 0.29 / 18.8;                    // the camera is still from 18.97 on
  let landed = 0;
  S2.halves.forEach(o => {
    o.w.innerHTML = u < 9.35 ? `<span class="mb">W</span><span style="opacity:${(seg(u, 0.4, 0.8) * (1 - seg(u, 9.15, 9.35))).toFixed(3)}"> + Δ<span class="mb">W</span></span>`
                             : `<span class="mb">W</span> <span style="opacity:${seg(u, 9.3, 9.49).toFixed(3)}">${lock(seg(u, 9.49, 9.76))}</span>`;
    o.z.forEach((s, c) => s.set(vals(100 + 10 * o.k + c + 1000 * seedK, 5)));
    o.h.forEach((s, c) => s.set(vals(200 + 10 * o.k + c + 1000 * seedK, 5)));
    o.plus.forEach((p, c) => { const a = 4.35 + 0.05 * (c + 6 * o.k), w = 13.6 + 0.06 * o.order[c];   // each + comes and goes with its stripe
      op(p, seg(u, a, a + 0.4) * (1 - seg(u, 9.15, 9.4)) + seg(u, w + 0.15, w + 0.45) * (1 - seg(u, 20.54, 21.04))); });
    // ΔW z: a different stripe for every token, jittering until the weights are frozen
    o.d.forEach((s, c) => {
      const a = 4.35 + 0.05 * (c + 6 * o.k), p = seg(u, a, a + 0.4), f = seg(u, 9.15, 9.54);
      s.set(o.dv[c].map((v, j) => v + 0.22 * Math.sin(2 * Math.PI * (0.6 + 0.17 * c + 0.11 * o.k) * u + 1.7 * j + 2.3 * c + o.k)));
      css(s, { left: px(o.cols[c]), top: px(580 - 30 * (1 - p) + 40 * f) }); op(s, p * (1 - f));
    });
    o.dl.innerHTML = u < 11.48 ? `Δ<span class="mb">W</span><span class="mb">z</span><sub>${o.k ? 'j' : 'i'}</sub>` : S_;
    op(o.dl, u < 11.48 ? seg(u, 4.99, 5.46) * (1 - seg(u, 9.15, 9.4)) : seg(u, 14.7, 15.15) * (1 - seg(u, 20.54, 21.04)));
    // the copies of s: one wave out from the centre on "same", then they stack into the blue bar
    o.s.forEach((s, c) => {
      const i = o.order[c], a = 13.6 + 0.06 * i, p = seg(u, a, a + 0.45);
      const n = 6 * o.k + c, b = 20.44 + 0.05 * n, q = seg(u, b, b + 0.6);
      const [tx, ty] = s2w(Cf, S2.BX + bw * n / 12, 822), sc = 1 / Cf.k;
      const x = lerp(lerp(DX + 945, o.cols[c], p), tx, q), y = lerp(580 - 46 * Math.sin(Math.PI * p), ty, q);
      css(s, { left: px(x), top: px(y), transform: `scale(${lerp(1, bw / 12 * sc / 30 + 0.02, q).toFixed(4)}, ${lerp(1, 48 * sc / 100, q).toFixed(4)})` });
      op(s, (u >= a ? 1 : 0) * (1 - clamp((u - b - 0.52) / 0.08)));
      landed += seg(u, b + 0.45, b + 0.6);
    });
    // images: Base, RL-tuned, Base again once the weights are frozen, then Base + s; dimmed while another seed's inputs show
    const w = [1 - pRL + pBack * (1 - pS), pRL * (1 - pBack), pS];
    o.img.forEach((f, i) => op(f, w[i] * (seedK ? 0.25 : 1)));
    const lab = u < 1.48 ? 0 : u < 9.58 ? 1 : u < 14.63 ? 0 : 2;
    o.il.innerHTML = ['Base', 'RL-tuned', 'Base + ' + S_][lab]; o.il.className = 'abs lab ' + ['c-base', 'c-rl', 'c-s'][lab];
  });
  S2.rel.innerHTML = u < 11.48 ? 'Δ<span class="mb">W</span><span class="mb">z</span><sub>i</sub> ≠ Δ<span class="mb">W</span><span class="mb">z</span><sub>j</sub>'
                            : `the same ${S_} for prompts <i>i</i> and <i>j</i>`;
  op(S2.rel, u < 11.48 ? seg(u, 5.23, 5.7) * (1 - seg(u, 9.15, 9.4)) : seg(u, 15.37, 15.81) * (1 - seg(u, 17.85, 18.19)));
  // hud bars: the copies fill the small blue bar on "188"; the black LoRA bar grows on "parameters of a rank-32 LoRA"
  css(S2.b2, { width: px(bw * landed / 12) }); op(S2.b2, landed > 0 ? 1 : 0);
  op(S2.b2l, seg(u, 20.74, 21.04));
  S2.b2v.innerHTML = `0.29M<span style="opacity:${seg(u, 23.11, 23.41).toFixed(3)}"> · 1.5%</span>`; op(S2.b2v, seg(u, 21.51, 21.79));
  const p1 = seg(u, 24.84, 26.54);
  css(S2.b1, { width: px(S2.BW * p1) }); css(S2.b1v, { left: px(S2.BX + S2.BW * p1 + 20) });
  op(S2.b1l, seg(u, 24.72, 25.07)); op(S2.b1v, seg(u, 26.36, 26.64)); op(S2.b1, p1 > 0 ? 1 : 0);
  const C = cam(T); css(S2.bars, { transform: `translateX(${px(-(C.x - DX - 960) * C.k)})` });   // the bars leave with the canvas

    div(host, 'abs', `<div style="font-size:60px;font-weight:700;color:var(--s)">${big}</div><div style="font-size:32px">${small}</div>`, 210 + k * 510, 50, { width: '480px', textAlign: 'center' }));

S11.sx = t => lerp(S11.X0 - 40, S11.X0 + 6 * S11.W + 5 * S11.G, seg(t, 5.26, 7.31));   // the hero's sweep: the tiles turn as "89.8" is spoken

  S11.lab.innerHTML = done ? 'Base + ' + S_ : 'Base'; S11.lab.className = 'abs lab ' + (done ? 'c-s' : 'c-base'); op(S11.lab, seg(t, 0.3, 0.8));
  c.forEach((a, k) => { const p = seg(t, a, a + 0.5); op(S11.cards[k], p); css(S11.cards[k], { transform: `translateY(${px(20 * (1 - p))})` }); });

// ---------- the hero s: one stripe that travels the whole film; between its jobs it parks as a badge in the top-right corner ----------
const CHIP = mk($('top'), 'div', null, null, { position: 'absolute', left: '1780px', top: '0px', width: '140px', height: '156px', background: '#fff', borderRadius: '0 0 0 12px' });   // the badge's white backing: content panning under it stays hidden
const HERO = (() => { const g = mk($('top'), 'div', 'stripe sv');
  g.cells = SV.map((v, i) => mk(g, 'div', null, null, { top: (i * 20) + '%', height: 'calc(20% - 2px)' })); return g; })();
const BADGE = { x: 1852, y: 36, w: 24, h: 80, lab: div($('hudw'), 'abs', S_, 1808, 46, { fontSize: '44px' }) };
function heroState(T) {   // world position and size, badge share b, cell fill f
  let x, y, w = 30, h = 100, on = 1, f = 1;
  if (T < 6.3) { const p = seg(T, 5.7, 6.3); x = S1.SLOT; y = lerp(-420, 350, p); w = 40; h = 240; on = T >= 5.7 ? 1 : 0; }   // drops on "add"

    x = lerp(S1.SLOT, DX + 945, seg(T, 11.85, 12.9)); y = lerp(lerp(S1.Y[1] + 25, 880, q), 580, seg(T, 12.6, 13.1)); w = lerp(40, 30, q); h = lerp(240, 100, q); }
  else if (T < G[4] + 12.6) { x = R4B.x + 1380; y = R4B.y + 560; }                                                          // next to θ + s while it is fitted
  else if (T < G[5]) { const p = seg(T, G[4] + 12.6, G[5]);                                                                   // the fitted s drops into the test triplets
    x = lerp(R4B.x + 1380, R5.x + S5.XS[1], seg(T, G[4] + 13.2, G[5])); y = lerp(R4B.y + 560, R5.y + S5.RY[0] + 0.2 * S5.W, p); h = lerp(100, 0.6 * S5.W, p); }
  else if (T < G[8]) { const z = s5hero(T - G[5]); x = z.x; y = z.y; h = 0.6 * S5.W; }
  else if (T < G[9]) { const t8 = T - G[8]; x = R6B.x + S8.HX; y = R6B.y + S8.HY; f = 1 - seg(t8, 1.3, 1.9) + seg(t8, 6.8, 7.9); }          // s_RL: empty on "zero", filled as its bar grows
  else if (T < G[11]) { x = R9.x + S9.D.x + 236; y = R9.y + S9.D.y + 12; w = 24; h = 56; }                                 // scene 9: s joins block ℓ as the drawer opens
  else if (T < G[11] + 22.6) { x = R11.x + S11.sx(T - G[11]); y = R11.y + S11.Y[0] - 16; w = 40; h = 2 * S11.W + S11.G + 32; }   // scene 11: s sweeps the gallery
  else { x = R11.x + 948; y = R11.y + 262; w = 24; h = 72; }                                                                  // the final lockup: small, above the title
  const u2 = T - G[2];
  const b = seg(u2, 0.5, 1.14) * (1 - seg(u2, 10.78, 11.28))                     // scene 2: parked until "add fixed vectors"
          + seg(u2, 27.66, 28.48) * (1 - seg(T, G[4] + 8.0, G[4] + 8.9))         // scene 4: parked until "we fit the vectors"
          + seg(T, G[5] + 15.12, G[5] + 15.72) * (1 - seg(T, G[8] + 0.5, G[8] + 1.3))   // scenes 6-7: parked until "Trained from zero"
          + seg(T, G[8] + 13.6, G[8] + 14.3) * (1 - seg(T, G[9] + 11.8, G[9] + 12.4))   // scene 8 images: parked until the drawer opens
          + seg(T, G[10] - 1.4, G[10] - 0.6) * (1 - seg(T, G[11] + 3.75, G[11] + 4.54))   // scene 10: parked; scene 11: leaves to sweep the gallery on "one fixed set"
          + seg(T, G[11] + 7.69, G[11] + 8.53) * (1 - seg(T, G[11] + 28.16, G[11] + 28.78));   // back to the badge; joins the title lockup

function hero(T, C) {

  HERO.cells.forEach((c, i) => { c.style.background = `hsl(0,0%,${lerp(100, SHADE.s(SV[i]), clamp(H.f)).toFixed(1)}%)`; });
  op([BADGE.lab, CHIP], clamp((H.b - 0.6) / 0.4) * H.on);
}

function world(T) {
  const C = cam(T);
  css($('world'), { transform: `translate(${px(AX - C.x * C.k)}, ${px(AY - C.y * C.k)}) scale(${C.k.toFixed(5)})` });
  s1(T); s2(T - G[2], T); s4(T - G[4]); s5(T - G[5]); s6(T - G[6], T); s7(T - G[7], T); s8(T - G[8]);
  s9(T - G[9]); s10(T - G[10]); s11(T - G[11], window.PLAN[window.PLAN.length - 1]); hero(T, C);
}
window.render = async function (T) {
  const P = window.PLAN;

  for (const [ct, text] of S.caps) if (lt >= ct) c = text;

};

           [G[5] + 15.12, G[6] + 0.96, ctr(R6A)], [G[6] + 9.61, G[6] + 10.05, ctr(R6B)], [G[8] + 13.6, G[8] + 14.5, ctr(R8B)],
           [G[9] - 1.0, G[9] + 0.3, ctr(R9)], [G[10] - 1.4, G[10], ctr(R10)], [G[11] - 1.2, G[11] + 0.2, ctr(R11)]];

};
